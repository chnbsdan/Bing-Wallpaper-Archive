name: Archive update

on:
  schedule:
    - cron: '2 8 * * *'  # 每天 8:02 UTC 自动运行
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

concurrency:
  group: "archive_update"
  cancel-in-progress: false

jobs:
  update-archive:
    name: Update archive
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
          cache: 'pip'
          cache-dependency-path: src/requirements.txt

      - name: Install Python dependencies
        working-directory: src
        run: pip install -r requirements.txt

      # ----------------------------------------------------------------------------------------------------------------
      # ★★★ 核心：抓取壁纸（不需要任何 Cloudflare 环境变量） ★★★
      # ----------------------------------------------------------------------------------------------------------------
      - name: Update archive
        working-directory: src
        run: python bing.py
        # 如果 bing.py 需要 R2 相关的环境变量，可以在这里注释掉或移除
        # 如果 bing.py 不依赖 R2，直接删掉 env 部分
        # env:
        #   CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        #   CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
        #   CLOUDFLARE_R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}

      # ----------------------------------------------------------------------------------------------------------------
      # ★★★ 如果你不需要构建和部署网站，可以删除下面两个步骤 ★★★
      # ----------------------------------------------------------------------------------------------------------------
      # - name: Build website
      #   working-directory: src/website
      #   run: npm run build

      # - name: Deploy website
      #   working-directory: src/website
      #   run: npx wrangler deploy
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ----------------------------------------------------------------------------------------------------------------
      # ★★★ 如果你不需要更新 README，可以删除这个步骤 ★★★
      # ----------------------------------------------------------------------------------------------------------------
      # - name: Update README
      #   working-directory: src
      #   run: python update_readme.py
      #   env:
      #     CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #     CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      #     CLOUDFLARE_R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}

      # ----------------------------------------------------------------------------------------------------------------
      # ★★★ 提交更新到 GitHub ★★★
      # ----------------------------------------------------------------------------------------------------------------
      - name: Get previous commit author
        id: previous_commit
        run: echo "PREVIOUS_COMMIT_AUTHOR=$(git log -1 --pretty=%an)" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes (amend previous update)
        if: ${{ steps.previous_commit.outputs.PREVIOUS_COMMIT_AUTHOR == 'GitHub Actions' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Archive update
          commit_user_name: GitHub Actions
          commit_author: GitHub Actions <41898282+github-actions[bot]@users.noreply.github.com>
          file_pattern: 'api/* README.md'
          commit_options: --amend --no-edit
          push_options: --force
          skip_fetch: true

      - name: Commit and push changes
        if: ${{ steps.previous_commit.outputs.PREVIOUS_COMMIT_AUTHOR != 'GitHub Actions' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Archive update
          commit_user_name: GitHub Actions
          commit_author: GitHub Actions <41898282+github-actions[bot]@users.noreply.github.com>
          file_pattern: 'api/* README.md'
